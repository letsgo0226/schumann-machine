name: Schumann ST05 — synthetic browser video + browser-audio CI

on:
  pull_request:
    paths:
      - 'scripts/st05_browser_av_probe.py'
      - 'scripts/test_st05_contract.py'
      - '.github/workflows/st05-synthetic-browser-av.yml'
      - 'README_ST05.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schumann-st05-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-browser-screen-and-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned FFmpeg and FFprobe without apt (SHA-256 checked)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ffmpeg-wheels"
          python -m pip download --no-deps --only-binary=:all: --disable-pip-version-check \
            --dest "$RUNNER_TEMP/ffmpeg-wheels" 'ffmpeg-binaries==1.1.0'
          echo "b8a6d67f5895a8a105e25746db3bb3a4d6b76629cde22814f9866fd9af76a399  $RUNNER_TEMP/ffmpeg-wheels/ffmpeg_binaries-1.1.0-py3-none-manylinux1_x86_64.whl" | sha256sum --check --status
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import zipfile
          wheel = Path(os.environ["RUNNER_TEMP"]) / "ffmpeg-wheels" / "ffmpeg_binaries-1.1.0-py3-none-manylinux1_x86_64.whl"
          out = Path(os.environ["RUNNER_TEMP"]) / "st05-ffmpeg"
          out.mkdir(parents=True, exist_ok=False)
          with zipfile.ZipFile(wheel) as archive:
              for name in ("ffmpeg", "ffprobe"):
                  matches = [n for n in archive.namelist() if n.endswith("/binaries/" + name)]
                  if len(matches) != 1:
                      raise SystemExit("missing or duplicate binary: " + name)
                  dst = out / name
                  with archive.open(matches[0]) as source, dst.open("xb") as target:
                      shutil.copyfileobj(source, target)
                  dst.chmod(0o700)
                  subprocess.run([str(dst), "-version"], check=True, timeout=20,
                                 stdout=subprocess.DEVNULL)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as fh:
              fh.write(str(out) + "\n")
          print("ST05_PINNED_FFMPEG_VERIFIED")
          PY
      - name: Install Python Playwright and verify preinstalled Chrome/Xvfb
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          command -v Xvfb
          command -v xvfb-run
          command -v google-chrome || command -v chromium
      - name: Run synthetic-only input and media guard tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_st05_contract.py' -v
          python -m unittest discover -s scripts -p 'test_cvoc_media_evidence.py' -v
      - name: Record actual Xvfb Chromium window + in-browser media audio
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 960x540x24 -ac' \
            python scripts/st05_browser_av_probe.py --output-dir artifacts/st05_synthetic
      - name: Verify finished MP4 through independent existing media probe
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cvoc_media_evidence.py generate \
            artifacts/st05_synthetic/st05_capture.mp4 artifacts/st05_synthetic/st05_media_evidence.json
          python scripts/cvoc_media_evidence.py verify \
            artifacts/st05_synthetic/st05_capture.mp4 artifacts/st05_synthetic/st05_media_evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('artifacts/st05_synthetic/st05_report.json').read_text())
          assert obj['school_login_attempted'] is False
          assert obj['university_course_recorded'] is False
          assert obj['os_audio_monitor_verified'] is False
          assert obj['cvoc_native_verified'] is False
          assert obj['technical_evidence']['technical_checks_passed'] is True
          print('ST05_SYNTHETIC_ONLY_REPORT_VERIFIED')
          PY
      - name: Upload original synthetic demo and technical reports (1 day)
        uses: actions/upload-artifact@v4
        with:
          name: schumann-st05-original-browser-av
          path: |
            artifacts/st05_synthetic/st05_capture.mp4
            artifacts/st05_synthetic/st05_report.json
            artifacts/st05_synthetic/st05_media_evidence.json
          if-no-files-found: error
          retention-days: 1
