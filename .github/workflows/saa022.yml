name: SAA-022 complete alignment closure
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify bounded alignment and L5 countermodel
        run: |
          python -m py_compile saa022.py
          python saa022.py
