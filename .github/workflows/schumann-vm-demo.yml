name: Schumann VM screen recording — synthetic demo only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schumann-vm-synthetic-demo
  cancel-in-progress: false

jobs:
  vm-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install virtual desktop and audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg pulseaudio pulseaudio-utils
          python -m pip install 'playwright==1.56.0'
          command -v google-chrome || command -v chromium
      - name: Start disposable PulseAudio sink
        shell: bash
        run: |
          set -euo pipefail
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=schumann sink_properties=device.description=SchumannVM
          pactl set-default-sink schumann
      - name: Record locally generated video and sound in Xvfb
        shell: bash
        env:
          PULSE_SINK: schumann
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 960x540x24 -ac' \
            python scripts/recording_vm_probe.py --output artifacts/vm_synthetic_capture.mp4
      - name: Produce bounded read-only CVOC media handoff report
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cvoc_media_evidence.py generate \
            artifacts/vm_synthetic_capture.mp4 artifacts/vm_synthetic_evidence.json
          python3 scripts/cvoc_media_evidence.py verify \
            artifacts/vm_synthetic_capture.mp4 artifacts/vm_synthetic_evidence.json
      - name: Upload synthetic demo and technical evidence only
        uses: actions/upload-artifact@v4
        with:
          name: schumann-synthetic-vm-probe
          path: |
            artifacts/vm_synthetic_capture.mp4
            artifacts/vm_synthetic_evidence.json
          if-no-files-found: error
          retention-days: 1
