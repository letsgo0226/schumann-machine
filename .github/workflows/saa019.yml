name: SAA-019 L5 bounded formal experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  l5:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify L5 bounded formal countermodel
        run: |
          python -m py_compile saa019.py
          python saa019.py
