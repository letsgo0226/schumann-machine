name: Schumann synthetic media evidence — read-only CI

on:
  pull_request:
    paths:
      - 'scripts/cvoc_media_evidence.py'
      - 'scripts/test_cvoc_media_evidence.py'
      - 'README_CVOC_MEDIA_BRIDGE.md'
      - '.github/workflows/schumann-media-evidence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check local FFmpeg tools
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Reject silence, black frames and altered reports
        shell: bash
        run: python3 -m unittest discover -s scripts -p 'test_cvoc_media_evidence.py' -v
