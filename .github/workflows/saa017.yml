name: SAA-017 ontological independence countermodels
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check independence and bridge assumptions
        run: |
          python -m py_compile saa017.py
          python saa017.py
