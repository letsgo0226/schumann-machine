name: SAA-015 state continuity experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and verify state continuation
        run: |
          python -m py_compile saa015.py
          python saa015.py
