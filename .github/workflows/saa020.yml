name: SAA-020 self-encoding essence-existence alignment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source encoding and bounded transitions
        run: |
          python -m py_compile saa020.py
          python saa020.py
